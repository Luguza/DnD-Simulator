[project]
name = "dnd-simulator"
version = "0.1.0"
description = "Monte Carlo D&D 5e (2024/XPHB) combat simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dndsim"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Markdown is documentation, not source. Without this, `ruff format` would
# rewrite the code samples in DESIGN.md and in the skills, while the
# pre-commit hook (which only ever passes it .py/.pyi files) would not —
# so hook, CI and a local `ruff format` would disagree.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
