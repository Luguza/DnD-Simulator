[project]
name = "dnd-simulator"
version = "0.1.0"
description = "A Monte Carlo D&D 5e (2024 / XPHB) combat simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dndsim = "dndsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dndsim"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests/weapon_fixtures.py` is shared by `contract/` and `bench/`.
pythonpath = ["tests"]
# `-m "not bench"` keeps wall-clock assertions out of the ordinary suite: a
# throughput test on a shared CI runner fires on noise, and a gate that fires
# on noise gets turned off (DESIGN.md § The benchmark gate). Ask the M0
# question deliberately with `uv run pytest -m bench`; `w3i` is the task that
# turns it into a CI gate against a same-run baseline.
# `content` needs the gitignored 5etools data (`python -m dndsim.content.fetch`)
# and is asked the same way: `uv run pytest -m content`.
addopts = [
    "-ra", "--strict-markers", "--strict-config", "-m", "not bench and not content"
]
markers = [
    "bench: wall-clock performance measurements (roadmap w0i, w3i)",
    "content: the importer against the fetched 5etools data (roadmap w2a)",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Markdown is documentation, not source. Without this, `ruff format` would
# rewrite the code samples in DESIGN.md and in the skills, while the
# pre-commit hook (which only ever passes it .py/.pyi files) would not —
# so hook, CI and a local `ruff format` would disagree. Vendored skills are
# third-party content and are not ours to reformat at all.
extend-exclude = [".claude/skills", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
