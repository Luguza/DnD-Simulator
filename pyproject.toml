[project]
name = "dnd-simulator"
version = "0.1.0"
description = "A Monte Carlo D&D 5e (2024 / XPHB) combat simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dndsim = "dndsim.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dndsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "bench: performance benchmarks, excluded from the default run",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Vendored skill docs are third-party content; markdown code blocks are
# illustrative prose whose alignment is deliberate. The pre-commit hook only
# passes [python, pyi], so this keeps CI and the hook in agreement.
extend-exclude = [".claude/skills", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
