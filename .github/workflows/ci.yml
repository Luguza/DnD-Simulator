name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tool versions come from uv.lock, so CI, the pre-commit hook and a local
      # `uv run --frozen` all execute the same ruff and mypy.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version-file: .python-version

      - name: Sync the locked environment
        run: uv sync --frozen

      # Every check runs even after an earlier one fails, so a PR author sees
      # the whole list in one pass instead of one failure per push.
      - name: uv lock is up to date
        if: ${{ !cancelled() }}
        run: uv lock --check

      - name: ruff check
        if: ${{ !cancelled() }}
        run: uv run --frozen ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run --frozen ruff format --check .

      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run --frozen mypy .

      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run --frozen pytest

  # Which PRs the task loop may merge itself (docs/workflow.md § Merge
  # authority). Red here is not a defect — it is this job's only way of saying
  # "a human merges this one", which is why it is named for what it wants
  # rather than for what it checks.
  classify:
    name: human-merge-required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 0, not 1: the classification is a diff against the base branch, and
          # a shallow clone has no base to diff against.
          fetch-depth: 0

      - name: Classify the diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # -e because an errored `git diff` returns no filenames, and an empty
          # list is indistinguishable from "touched nothing contractual" — which
          # would wave a contract change straight through.
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if [ -z "$files" ]; then
            echo "No files changed; nothing to classify." >&2
            exit 1
          fi
          printf 'Changed files:\n%s\n' "$files"
          # The loop merges everything, the milestone PR into main included;
          # the human reviews the finished product (docs/workflow.md § Merge
          # authority). Two things still stop it:
          #
          # 1. Anything into main but the milestone PR. The loop only ever
          #    targets the milestone branch, so this is a wrong base or a
          #    change the human opened.
          # 2. A change to .github/workflows/, the milestone PR's included.
          #    claude-code-action skips itself when the workflow differs from
          #    the default branch and exits successfully, and the reviewer
          #    skips the milestone PR, so nobody would read the edit — and an
          #    edit to this job could switch the gate off.
          main=""
          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              milestone/*) ;;
              *) main="$HEAD_REF" ;;
            esac
          fi
          workflows=$(printf '%s\n' "$files" | grep -E '^\.github/workflows/' || true)
          if [ -n "$main" ] || [ -n "$workflows" ]; then
            {
              echo '## A human merges this one'
              echo
              echo 'The task loop may not merge this pull request. That is what this'
              echo 'job failing means; nothing is broken.'
              echo
              if [ -n "$main" ]; then
                echo "It targets main; the loop only ever targets a milestone branch."
                echo
              fi
              if [ -n "$workflows" ]; then
                echo 'It edits the workflows, which the reviewer cannot review:'
                echo
                printf '%s\n' "$workflows" | sed 's/^/- `/;s/$/`/'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'Human merge required.\n%s\n%s\n' "$main" "$workflows"
            exit 1
          fi
          echo 'No workflow change, and main only from a milestone branch; the loop may merge.'
