name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tool versions come from uv.lock, so CI, the pre-commit hook and a local
      # `uv run --frozen` all execute the same ruff and mypy.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version-file: .python-version

      - name: Sync the locked environment
        run: uv sync --frozen

      # Every check runs even after an earlier one fails, so a PR author sees
      # the whole list in one pass instead of one failure per push.
      - name: uv lock is up to date
        if: ${{ !cancelled() }}
        run: uv lock --check

      - name: ruff check
        if: ${{ !cancelled() }}
        run: uv run --frozen ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run --frozen ruff format --check .

      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run --frozen mypy .

      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run --frozen pytest
