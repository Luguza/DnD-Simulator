name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review of the one before it. Without this a burst of
# pushes runs a burst of reviews to completion, all but the last of them against
# a diff nobody will merge — PR #19 took 27 pushes, so this is the difference
# between 27 reviews and 27 reviews' worth of tokens spent on 26 stale diffs.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are work in progress by definition. `ready_for_review` is in the
    # trigger list above, so a draft is reviewed once, when it stops being one,
    # instead of on every push while it is still being written.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: posting to the PR is a write on the pulls API, and the
      # action's installation token is scoped to whatever this block grants.
      # With `read` the review runs, finds nothing it can post, and the job
      # still reports success.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: the review's first step is `git diff <base>...HEAD`, which
          # needs the base branch in the local history. A shallow clone leaves
          # the agent with no diff to review.
          fetch-depth: 0

      # Which of the two reviews below runs. The split exists because the two
      # kinds of change in this repo fail in completely different ways: code
      # fails at the crit split and the reset scopes, prose fails at
      # contradicting DESIGN.md. Sending a documentation PR to a reviewer
      # hunting for code defects buys nothing and costs the most expensive
      # configuration available.
      - name: Classify the diff
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # -e, and the fetch, because the failure mode here is silent and
          # expensive: a `git diff` that errors returns no filenames, an empty
          # list looks exactly like "changed nothing but markdown", and a code
          # PR would be routed to the prose reviewer with nobody the
          # wiser. Fail the step instead and let the post step say so.
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          printf 'Changed files:\n%s\n' "$files"
          # grep -qv '\.md$' asks "is there a file that is not markdown?".
          if [ -n "$files" ] && printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Code PRs -------------------------------------------------------
      # graft/ is gitignored, so the graph is built here from the checked-out
      # head. `build` without --deep is the $0 no-key layer. Pinned, so a new
      # graft release cannot change what the reviewer sees between two pushes.
      # The build takes ~2s; the npm install took ~46s of every run, so the
      # install is cached and the graph is not. The key carries the Node
      # version because tree-sitter's bindings are built against its ABI.
      - name: Locate the graft install
        id: graft
        if: steps.scope.outputs.docs_only == 'false'
        run: |
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "$HOME/.graft-cli/bin" >> "$GITHUB_PATH"

      - name: Restore the graft install
        id: graft-cache
        if: steps.scope.outputs.docs_only == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.graft-cli
          key: graft-0.18.0-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.graft.outputs.node }}

      - name: Build the graft graph
        if: steps.scope.outputs.docs_only == 'false'
        env:
          CACHE_HIT: ${{ steps.graft-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            npm install --global --prefix "$HOME/.graft-cli" --no-fund --no-audit @nanonets/graft@0.18.0
          fi
          graft telemetry disable
          graft build

      - name: Review the code
        id: code-review
        if: steps.scope.outputs.docs_only == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No plugin marketplace: the review this repo needs is already in the
          # repo — .claude/skills/pr-review/SKILL.md for the two axes and
          # CODING_STANDARDS.md for the checklist, which knows what a plugin
          # cannot: the crit dice/flat split, the reset scopes, the frozen
          # registry, the content anti-corruption layer. The two things worth
          # keeping from the plugin, a verification pass and a fixed finding
          # shape, are asked for below instead of installed.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.

            Scope is the diff: `git diff origin/${{ github.base_ref }}...HEAD`.
            The repo is indexed by graft; read `.claude/skills/graft/SKILL.md`
            and use its CLI for context beyond the diff — `graft callers <sym>
            --depth 2` for what a changed symbol breaks, `graft skeleton <file>`
            for a file's API, `graft ask "<question>" --source` to locate code.
            Open a whole file only when neither the diff nor graft can settle a
            question.
            Never read DESIGN.md, ROADMAP.md or docs/decisions.md end to end —
            they are 160KB, 82KB and 72KB. Grep them for the one claim you need.

            The review is this repo's own skill. Read
            `.claude/skills/pr-review/SKILL.md` and apply both of its axes:
            Standards against `CODING_STANDARDS.md`, Spec against the task row
            the skill tells you how to find. CLAUDE.md is already in your
            context; it and DESIGN.md are the contract.

            Work in two passes.

            Pass 1 — find. Collect candidate findings on both axes.

            Pass 2 — verify. For each candidate, re-read the cited lines in the
            file itself, not in the diff, and construct the concrete failure:
            the input or state that produces the wrong result. Drop every
            candidate whose failure you cannot construct and whose violated rule
            you cannot quote. This pass is the point of the review — reporting
            pass 1's guesses is worse than reporting nothing.

            Then report, and report nothing else. No preamble, no summary of
            what the change does, no praise, no closing assessment. Exactly this
            shape:

            ## Standards

            1. **CONFIRMED** · `path/to/file.py:123` · crit-split
               One sentence naming the defect.
               One sentence: concrete input or state -> wrong output.

            ## Spec

            1. **PLAUSIBLE** · `path/to/file.py:45` · spec
               One sentence naming what the row asked and the diff does not do.
               One sentence quoting the row.

            CONFIRMED means you traced the failure. PLAUSIBLE means the rule is
            violated but you could not construct the failure. The third field is
            the rule: crit-split, reset-scope, frozen-registry,
            content-boundary, determinism, citation, golden, smell, spec, or
            other. Write "No findings." under an axis with none, and "No spec."
            under Spec when the skill finds none.

            Within each axis rank correctness bugs, then boundary violations,
            then everything else; never rerank across the two. At most 8
            findings in all; if more survive pass 2, report the worst and say
            how many you dropped.

            If nothing survives pass 2 on either axis, reply with exactly:
            No findings.
          # Opus 5 at medium effort, pinned: every Claude job in CI runs the same
          # model and effort, so a verdict does not shift when an alias moves.
          # The action's base GitHub/file tools are always included; --allowedTools
          # only adds. Arbitrary Bash is NOT on by default, so the read-only git
          # and graft commands the review depends on have to be listed
          # explicitly or they come back as permission denials.
          # --disallowedTools Agent,Task: the review otherwise fans out into
          # parallel finder subagents, then ends its turn saying it will wait for
          # their completion notifications. In headless CI there is no next turn
          # to deliver those, so the run terminates with the subagents pending and
          # their findings never collected. Forcing a single inline pass is both
          # the only way this finishes and much the cheaper one.
          claude_args: >-
            --model claude-opus-5
            --effort medium
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),Bash(git ls-files:*),Bash(graft ask:*),Bash(graft grep:*),Bash(graft skeleton:*),Bash(graft callers:*),Bash(graft map:*)"
            --disallowedTools "Agent,Task"

      # --- Documentation-only PRs -----------------------------------------
      - name: Review the documentation
        id: docs-review
        if: steps.scope.outputs.docs_only == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review documentation-only pull request
            #${{ github.event.pull_request.number }}.

            Nothing here is code, so do not hunt for code defects. DESIGN.md,
            ROADMAP.md and CLAUDE.md are this project's contract, and a defect
            in them is one that every later feature inherits. Check the diff —
            `git diff origin/${{ github.base_ref }}...HEAD` — for four things
            and nothing else:

            1. Self-contradiction: the change says something the same document
               already says differently.
            2. Cross-document contradiction: it contradicts CLAUDE.md,
               DESIGN.md or ROADMAP.md. Grep for the specific claim. Never read
               those files end to end; they are 160KB, 82KB and 17KB.
            3. Arithmetic and counts: task counts, hook counts, wave numbers,
               worked examples, formulas. Recompute anything the text asserts.
            4. Unowned obligations: a new requirement with no ROADMAP.md task
               that delivers it, or a reference to a task id that does not
               exist.

            Read only the sections the diff touches or names.

            Report nothing but findings — no preamble, no summary, no praise.
            Exactly this shape:

            ## Findings

            1. `DESIGN.md:1234` · contradiction
               One sentence naming the defect.
               One sentence: what it contradicts, or what it should say.

            The second field is one of: contradiction, arithmetic, unowned,
            other. At most 8 findings.

            If nothing is wrong, reply with exactly: No findings.
          # No code-review skill: this pass reads prose for contradictions and
          # recomputes counts. Same model, effort and subagent denial as above.
          claude_args: >-
            --model claude-opus-5
            --effort medium
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git ls-files:*)"
            --disallowedTools "Agent,Task"

      # The review's own output never reaches the PR by itself — it goes to the
      # action's execution log, which is hidden. This step posts it as one
      # top-level comment, and always says something, including "found nothing".
      # Three separate misconfigurations went unnoticed here precisely because a
      # clean review and a review that never ran looked identical: both silent.
      - name: Post review comment
        if: always() && github.event.pull_request != null
        uses: actions/github-script@v8
        env:
          # Whichever of the two reviews ran. Only set when Claude actually
          # executed; empty when the action skipped itself (see the
          # workflow-validation note below).
          REVIEW_SESSION_ID: ${{ steps.code-review.outputs.session_id || steps.docs-review.outputs.session_id }}
          REVIEW_LOG: ${{ steps.code-review.outputs.execution_file || steps.docs-review.outputs.execution_file }}
          REVIEW_KIND: ${{ steps.scope.outputs.docs_only == 'true' && 'documentation' || 'code' }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- claude-review-verdict -->';
            const FOOTER = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const LIMIT = 60000; // GitHub rejects comment bodies over 65536.
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const short = pr.head.sha.slice(0, 7);
            const kind = process.env.REVIEW_KIND || 'code';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // The execution log is a stream of SDK messages, saved either as one
            // JSON array or as JSONL depending on version. Accept both.
            const parseLog = (path) => {
              const raw = fs.readFileSync(path, 'utf8').trim();
              if (!raw) return [];
              try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [parsed];
              } catch {
                return raw.split('\n').flatMap((line) => {
                  try { return [JSON.parse(line)]; } catch { return []; }
                });
              }
            };

            // Prefer the run's own `result`; fall back to the last thing Claude
            // said, which is where the review restates its findings.
            const finalText = (messages) => {
              for (let i = messages.length - 1; i >= 0; i--) {
                const m = messages[i];
                if (m?.type === 'result' && typeof m.result === 'string' && m.result.trim()) {
                  return m.result.trim();
                }
              }
              for (let i = messages.length - 1; i >= 0; i--) {
                const m = messages[i];
                if (m?.type !== 'assistant') continue;
                const text = (m.message?.content ?? [])
                  .filter((b) => b?.type === 'text' && typeof b.text === 'string')
                  .map((b) => b.text)
                  .join('\n')
                  .trim();
                if (text) return text;
              }
              return '';
            };

            // Count subagent calls whose result never came back. Matching the
            // tool_use id against the tool_result ids is exact, so a *denied*
            // subagent call (which does get a result) is not miscounted as an
            // abandoned one.
            const pendingSubagents = (messages) => {
              const spawned = new Set();
              const returned = new Set();
              for (const m of messages) {
                for (const b of m?.message?.content ?? []) {
                  if (b?.type === 'tool_use' && (b.name === 'Agent' || b.name === 'Task')) {
                    spawned.add(b.id);
                  } else if (b?.type === 'tool_result' && b.tool_use_id) {
                    returned.add(b.tool_use_id);
                  }
                }
              }
              return [...spawned].filter((id) => !returned.has(id)).length;
            };

            let verdict;
            if (!process.env.REVIEW_SESSION_ID) {
              // claude-code-action refuses to run when this workflow file is not
              // byte-identical to the copy on the default branch, and it exits
              // *successfully* when it refuses. Never report that as a pass.
              verdict = [
                `## ⚠️ The review did not run on \`${short}\``,
                '',
                'This is **not** a pass. Two things cause it. The action skips itself when',
                '`.github/workflows/claude-code-review.yml` differs from the copy on the',
                'default branch — if this PR edits that file, that is expected and it will',
                'run once merged. Otherwise the diff could not be classified, so neither',
                `review was dispatched. The [run log](${runUrl}) says which.`,
              ].join('\n');
            } else {
              // Distinguish "ran and said nothing" from "we could not read what
              // it said". Only the first is a clean bill of health; reporting
              // the second as a pass is the exact failure this step exists to
              // prevent. A real run always emits messages, so zero parsed
              // messages means the log is unusable, not that the review was
              // quiet.
              let messages = null;
              try {
                const parsed = parseLog(process.env.REVIEW_LOG);
                if (parsed.length) messages = parsed;
                else core.warning('The review log parsed to zero messages.');
              } catch (err) {
                core.warning(`Could not read the review log: ${err.message}`);
              }

              if (messages === null) {
                verdict = [
                  `## ⚠️ The review ran, but its output could not be read`,
                  '',
                  `This is **not** a pass. Claude reviewed \`${short}\`, but the execution`,
                  'log was missing or unparseable, so there is nothing to report here.',
                  `The findings, if any, are in the [run log](${runUrl}).`,
                ].join('\n');
              } else {
                let review = finalText(messages);
                if (review.length > LIMIT) {
                  review = `${review.slice(0, LIMIT)}\n\n_…truncated; full output in the [run log](${runUrl})._`;
                }
                // A run can end while subagents it spawned are still pending, in
                // which case its last words are a progress note and the findings
                // were never collected. Detect that structurally — a subagent
                // tool call with no matching tool_result — rather than by
                // pattern-matching the prose, and never dress it up as a review.
                const pending = pendingSubagents(messages);
                // "No findings." is the clean outcome both prompts ask for by
                // name. Match it here so the clean case reads as a verdict
                // rather than as a one-line quote of the model.
                const clean = /^no findings\.?$/i.test(review.trim());
                if (pending) {
                  verdict = [
                    `## ⚠️ The review did not finish on \`${short}\``,
                    '',
                    `This is **not** a pass. It spawned ${pending} review subagent${pending === 1 ? '' : 's'}`,
                    'that never reported back before the run ended, so the findings were',
                    'never collected. What it managed to say:',
                    '',
                    review ? `> ${review.split('\n').join('\n> ')}` : '_(nothing)_',
                    '',
                    `[run log](${runUrl})`,
                  ].join('\n');
                } else if (review && !clean) {
                  verdict = `## Claude ${kind} review of \`${short}\`\n\n${review}\n\n<sub>[run log](${runUrl})</sub>`;
                } else {
                  verdict = `## ✅ Looks good\n\nClaude's ${kind} review of \`${short}\` found nothing worth flagging. ([run log](${runUrl}))`;
                }
              }
            }

            const body = `${MARKER}\n${verdict}${FOOTER}`;

            // One sticky comment per PR, rewritten on each push, so a long-running
            // PR does not accumulate one review per commit.
            const existing = (await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 },
            )).find((c) => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
