name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.py"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: posting an inline review comment is a write on the
      # pulls API, and the action's installation token is scoped to whatever
      # this block grants. With `read` the review runs, finds nothing it can
      # post, and the job still reports success.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 0, not 1: the review's first step is `git diff <base>...HEAD`, which
          # needs the base branch in the local history. A shallow clone leaves
          # the agent with no diff to review.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The action's base GitHub/file tools are always included; --allowedTools
          # only adds. Arbitrary Bash is NOT on by default, so the read-only git
          # commands the review depends on have to be listed explicitly or they
          # come back as permission denials.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),Bash(git ls-files:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The review posts inline comments per finding, so a clean PR produces
      # silence — indistinguishable from the job not running at all, which is
      # how three separate misconfigurations went unnoticed here. This step
      # always leaves exactly one verdict comment, including "found nothing".
      #
      # It derives the verdict from the API rather than from the model, so a
      # review that ends without reporting cannot masquerade as a clean one.
      - name: Post review verdict
        if: always() && github.event.pull_request != null
        uses: actions/github-script@v8
        env:
          # Only set when Claude actually executed. Empty when the action
          # skipped itself (see the workflow-validation note below).
          REVIEW_SESSION_ID: ${{ steps.claude-review.outputs.session_id }}
        with:
          script: |
            const MARKER = '<!-- claude-review-verdict -->';
            const FOOTER = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const short = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let verdict;
            if (!process.env.REVIEW_SESSION_ID) {
              // claude-code-action refuses to run when this workflow file is not
              // byte-identical to the copy on the default branch, and it exits
              // *successfully* when it does. Say so instead of claiming a pass.
              verdict = [
                `⚠️ **The review did not run** on \`${short}\`, so this is not a pass.`,
                '',
                'The action skips itself when `.github/workflows/claude-code-review.yml`',
                'differs from the copy on the default branch. If this PR edits that file,',
                'that is expected and it will run once merged; otherwise check the',
                `[run log](${runUrl}).`,
              ].join('\n');
            } else {
              const comments = await github.paginate(
                github.rest.pulls.listReviewComments,
                { owner, repo, pull_number: pr.number, per_page: 100 },
              );
              const n = comments.filter((c) => c.commit_id === sha).length;
              verdict = n === 0
                ? `✅ **Looks good.** Claude reviewed \`${short}\` and found nothing worth flagging. ([run log](${runUrl}))`
                : `🔍 Claude reviewed \`${short}\` and left **${n} inline comment${n === 1 ? '' : 's'}**. ([run log](${runUrl}))`;
            }

            const body = `${MARKER}\n${verdict}${FOOTER}`;

            // One sticky comment per PR, rewritten on each push, so a long-running
            // PR does not accumulate one verdict per commit.
            const existing = (await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 },
            )).find((c) => c.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
