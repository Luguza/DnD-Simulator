name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    name: automated review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the reviewer needs the base commit to diff against

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5"
          track_progress: true
          prompt: |
            Review this pull request against the invariants in
            `.claude/skills/pr-review/SKILL.md`. Read that file first — it is
            the checklist, and CLAUDE.md and DESIGN.md are the contract behind
            it.

            Report only findings you can tie to a specific line and a specific
            rule. Rank them: correctness bugs first, then boundary violations,
            then everything else. If a change is clean, say so in one line
            rather than manufacturing findings — a review that always finds
            something is a review nobody reads.

            Do not push commits or edit files; leave review comments only.
